<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAN MAN | Your Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        <img src="images/logo.png" alt="JAN MAN Logo">
        <h1>JAN MAN</h1>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="#">Shop</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="cart-icon">
        <a href="cart.html">
            🛒<span id="cart-count">0</span>
        </a>
    </div>

</header>

<section class="cart-page">

    <h2>Your Cart</h2>

    <div id="cart-items"></div>

    <div id="cart-summary" class="cart-summary">
        <div class="cart-total">
            Total: <span id="cart-total">0</span> EGP
        </div>
        <button id="checkout-btn">Complete Order via WhatsApp</button>
    </div>

</section>

<!-- Checkout Form (shown after clicking Complete Order) -->
<div id="checkout-modal" class="checkout-modal hidden">
    <div class="checkout-box">
        <h3>Delivery Details</h3>

        <input type="text" id="customer-name" placeholder="Full Name">
        <input type="tel" id="customer-phone" placeholder="Phone Number">
        <input type="text" id="customer-address" placeholder="Address / City">

        <div class="checkout-actions">
            <button id="cancel-checkout">Cancel</button>
            <button id="send-order">Send Order</button>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 JAN MAN. All Rights Reserved.</p>
</footer>

<!-- Toast Notification -->
<div id="toast"></div>

<script src="cart.js"></script>

</body>
</html>
