<section class="cart-page">

    <h2>Your Cart</h2>

    <div id="cart-items"></div>

    <div id="cart-summary" class="cart-summary">
        <div class="cart-total">
            Total: <span id="cart-total">0</span> EGP
        </div>
        <button id="checkout-btn">Complete Order via WhatsApp</button>
    </div>

</section>

<!-- Checkout Form (shown after clicking Complete Order) -->
<div id="checkout-modal" class="checkout-modal hidden">
    <div class="checkout-box">
        <h3>Delivery Details</h3>

        <input type="text" id="customer-name" placeholder="Full Name">
        <input type="tel" id="customer-phone" placeholder="Phone Number (starts with 0)">

        <select id="customer-governorate">
            <option value="">Select Governorate</option>
            <option value="القاهرة">القاهرة</option>
            <option value="الجيزة">الجيزة</option>
            <option value="الإسكندرية">الإسكندرية</option>
            <option value="الدقهلية">الدقهلية</option>
            <option value="الشرقية">الشرقية</option>
            <option value="المنوفية">المنوفية</option>
            <option value="القليوبية">القليوبية</option>
            <option value="الغربية">الغربية</option>
            <option value="البحيرة">البحيرة</option>
            <option value="كفر الشيخ">كفر الشيخ</option>
            <option value="دمياط">دمياط</option>
            <option value="بورسعيد">بورسعيد</option>
            <option value="الإسماعيلية">الإسماعيلية</option>
            <option value="السويس">السويس</option>
            <option value="شمال سيناء">شمال سيناء</option>
            <option value="جنوب سيناء">جنوب سيناء</option>
            <option value="الفيوم">الفيوم</option>
            <option value="بني سويف">بني سويف</option>
            <option value="المنيا">المنيا</option>
            <option value="أسيوط">أسيوط</option>
            <option value="سوهاج">سوهاج</option>
            <option value="قنا">قنا</option>
            <option value="الأقصر">الأقصر</option>
            <option value="أسوان">أسوان</option>
            <option value="البحر الأحمر">البحر الأحمر</option>
            <option value="الوادي الجديد">الوادي الجديد</option>
            <option value="مطروح">مطروح</option>
        </select>

        <input type="text" id="customer-city" placeholder="City / Area">
        <input type="text" id="customer-address" placeholder="Detailed Address (street, building, floor)">

        <div class="checkout-summary">
            <div class="summary-row">
                <span>Products Total</span>
                <span id="summary-products">0 EGP</span>
            </div>
            <div class="summary-row">
                <span>Shipping</span>
                <span id="summary-shipping">— Select governorate</span>
            </div>
            <div class="summary-row summary-total">
                <span>Total</span>
                <span id="summary-total">0 EGP</span>
            </div>
        </div>

        <div class="checkout-actions">
            <button id="cancel-checkout">Cancel</button>
            <button id="send-order">Send Order</button>
        </div>
    </div>
</div>

<footer>
    <p>© 2026 JAN MAN. All Rights Reserved.</p>
